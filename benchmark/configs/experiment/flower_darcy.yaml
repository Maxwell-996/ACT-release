# @package _global_
defaults:
  - /data: darcy
  - /model: flower
  - /lr_scheduler: step_lr


model:
  # DarcyFlow uses Dirichlet (wall) boundaries -> zeros padding for the deform grid_sample.
  boundary_condition_types: [WALL]

trainer:
  loss_fn:
    _target_: benchmark.metrics.MSE
  formatter: channels_first_default

# DarcyFlow is steady-state (nu -> u). Override the global n_steps_input=4 default.
data:
  n_steps_input: 1
  n_steps_output: 1

name: flower_darcy
