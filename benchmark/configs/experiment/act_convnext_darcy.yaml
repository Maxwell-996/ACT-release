# @package _global_
# ConvNeXt U-Net with multi-head ACT blocks on steady-state DarcyFlow (nu -> u).
defaults:
  - /data: darcy
  - /model: act_unet_convnext
  - /lr_scheduler: step_lr

data:
  n_steps_input: 1
  n_steps_output: 1

model:
  # DarcyFlow has homogeneous Dirichlet (u=0) boundaries, not periodic.
  boundary_mode: zeros

trainer:
  loss_fn:
    _target_: benchmark.metrics.MSE
  formatter: channels_first_default

name: act_unet_convnext_darcy
