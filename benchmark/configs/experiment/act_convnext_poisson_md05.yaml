# @package _global_
# ACT ConvNeXt U-Net on poisson_gauss with max_disp=0.5.
defaults:
  - /data: poisson_gauss
  - /model: act_unet_convnext
  - /lr_scheduler: step_lr

model:
  max_disp: 0.5

trainer:
  loss_fn:
    _target_: benchmark.metrics.MSE
  formatter: channels_first_default

data:
  n_steps_input: 1
  n_steps_output: 1

name: act_convnext_poisson_md05
