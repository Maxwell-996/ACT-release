# @package _global_
defaults:
  - /data: poisson_gauss
  - /model: flower
  - /lr_scheduler: step_lr

model:
  # Poisson-Gauss uses Dirichlet (zero) boundary conditions -> wall padding.
  boundary_condition_types: [WALL]

trainer:
  loss_fn:
    _target_: benchmark.metrics.MSE
  formatter: channels_first_default

data:
  n_steps_input: 1
  n_steps_output: 1

name: flower_poisson
